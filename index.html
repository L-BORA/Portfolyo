<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>101 Okey Puan Takibi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:#f5efe0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  background:radial-gradient(ellipse at 50% -10%,#21674f 0%,#143f32 55%,#0b261e 100%) fixed;
}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:clamp(1.4rem,4vw,2rem);margin:0;letter-spacing:.02em}
h2{margin:0;font-size:clamp(1.1rem,3vw,1.35rem)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:18px;height:24px;border-radius:4px;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.35);transform:rotate(var(--r));margin-left:-2px}
.card{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:clamp(12px,2.5vw,18px);box-shadow:0 12px 30px rgba(0,0,0,.25);min-width:0}
.muted{color:#b9c9bf;font-size:.92rem}
.err{color:#ff9d8c;min-height:1.2em;margin:8px 0}
.sec{font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:#d8c98f;margin:0 0 12px}

button{font:inherit;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;cursor:pointer;color:#2a1d00;background:linear-gradient(#f7d877,#e0ad2c);font-weight:700;box-shadow:0 4px 0 #a97d12;transition:transform .08s;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a97d12}
button.ghost{background:transparent;color:#f5efe0;border:1px solid rgba(255,255,255,.35);box-shadow:none;font-weight:600}
button.ghost:active{transform:none}
button.danger{background:linear-gradient(#e7786b,#b3412e);color:#fff;box-shadow:0 4px 0 #7d2a1e}
button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid #f7d877;outline-offset:2px}
button.big{min-height:60px;font-size:1.12rem;padding:0 28px}
input[type=text],input[type=number]{font:inherit;min-height:48px;padding:0 12px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#0d261f;color:#f5efe0;width:100%}
input::placeholder{color:#7f9a8f}
input:disabled{opacity:.5}

.screen[hidden]{display:none}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.bar h2{flex:1;min-width:0}
.btns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.btns button{flex:1 1 auto}
.hero{text-align:center;padding:24px 16px}
.hero h2{font-size:clamp(1.3rem,4vw,1.6rem);margin-bottom:8px}
.hero button{width:100%;max-width:340px}
.home-tiles{display:grid;grid-template-columns:repeat(2,84px);gap:12px;justify-content:center;margin:16px 0 22px}
.home-tiles .tile{width:84px;max-width:84px}
.home-tiles .tile:hover{transform:none}
.hist{margin-top:16px}

/* Seçenek kartları */
.opt-grid{display:grid;grid-template-columns:1fr;gap:12px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:96px;padding:16px 18px;background:linear-gradient(160deg,#225d4c,#153a2f);color:#f5efe0;border:1px solid rgba(247,216,119,.35);border-radius:18px;box-shadow:0 8px 0 rgba(0,0,0,.3);font-weight:400}
.opt b{font-size:1.2rem;color:#fff}
.opt small{color:#c4d3ca;font-size:.9rem;font-weight:400;line-height:1.35}
.opt.wide{grid-column:1/-1}
.opt.sel{border:2px solid #f7d877;box-shadow:0 8px 0 rgba(0,0,0,.3),0 0 0 4px rgba(247,216,119,.25)}
.opt:hover,.opt:focus-visible{border-color:#f7d877}
.opt:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.3)}

/* Masa */
.felt{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:". top ." "left mid right" ". bottom .";
  gap:10px;align-items:center;padding:18px;border-radius:36px;max-width:620px;margin:0 auto;
  background:radial-gradient(ellipse at center,#2f8267 0%,#1c5544 70%,#153f33 100%);
  border:10px solid #6b4a24;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.4);
}
.seat{display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.28);border-radius:14px;padding:10px;min-width:0}
.seat .pos{font-size:.8rem;color:#f7d877;letter-spacing:.04em}
.s-top{grid-area:top}.s-left{grid-area:left}.s-right{grid-area:right}.s-bottom{grid-area:bottom}
.felt-mid{grid-area:mid;text-align:center;color:#f7d877;font-size:2rem;line-height:1}
.felt-mid small{display:block;font-size:.7rem;color:#c4d3ca;margin-top:6px}
.hint{margin:0 0 14px}

/* Durum ve skor tablosu */
.status{margin:4px 0 14px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:58px;border-radius:8px;background:linear-gradient(160deg,#fffdf6,#efe6d0);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.3);font-weight:900;font-size:1.1rem;line-height:1}
.mini small{font-size:.5rem;color:#6b6456;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.actions button{flex:1 1 150px}
.table{display:flex;flex-direction:column;min-width:0}
.trow{display:grid;grid-template-columns:minmax(50px,.9fr) repeat(4,minmax(0,1fr));gap:4px;align-items:center;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center;font-variant-numeric:tabular-nums;font-size:.95rem}
.trow>div:first-child{text-align:left}
.thead{font-weight:700;border-bottom:2px solid rgba(247,216,119,.5);color:#f7d877}
.thead>div{overflow-wrap:anywhere;font-size:.85rem;line-height:1.2}
.thead small,.trow small{display:block;font-weight:400;color:#b9c9bf;font-size:.75rem}
.neg{color:#ff9d8c}
.total{font-size:1rem;font-weight:800;border-bottom:none}
.total>div:first-child{font-size:.85rem}
.lead{background:rgba(247,216,119,.18);border-radius:10px;color:#f7d877;box-shadow:inset 0 0 0 1px rgba(247,216,119,.5)}
.teams{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center}
.team b{display:block;font-size:1.5rem}
.team.lead b{color:#f7d877}

/* Okey taşları */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.5vw,18px);margin:18px 0 8px}
.tile{
  position:relative;width:100%;max-width:150px;aspect-ratio:3/4;margin:0 auto;padding:12px 6px 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:linear-gradient(165deg,#fffdf6 0%,#f3ebd6 60%,#e6dcc0 100%);
  color:#1b2a24;border-radius:16px;
  box-shadow:0 8px 0 rgba(0,0,0,.35),0 16px 26px rgba(0,0,0,.4);
  transition:transform .2s ease,box-shadow .2s ease;
}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 14px 0 rgba(0,0,0,.35),0 22px 30px rgba(0,0,0,.45)}
.tile:active{transform:translateY(2px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.tname{font-size:clamp(.6rem,2vw,.78rem);text-transform:uppercase;letter-spacing:.06em;color:#6b6456;font-weight:700}
.tx{font-size:clamp(1.8rem,7vw,3rem);font-weight:900;line-height:1;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.6)}
.tbar{width:72%;height:10px;border-radius:6px;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

/* Giriş animasyonu: grup içindeki her öğe sırayla düşer */
@keyframes drop{
  0%{opacity:0;transform:translateY(-160px) rotate(-16deg) scale(.8)}
  60%{opacity:1;transform:translateY(12px) rotate(4deg) scale(1.04)}
  80%{transform:translateY(-5px) rotate(-1deg) scale(1)}
  100%{opacity:1;transform:none}
}
.grp.intro>*{opacity:0;pointer-events:none;animation:drop .65s cubic-bezier(.2,.8,.3,1) var(--d,0s) both}
@media (prefers-reduced-motion: reduce){
  .grp.intro>*{animation:none;opacity:1}
  .from-r,.from-l{animation:none}
}

/* Oyuncu / kayıt listesi */
.plist{display:grid;gap:10px;margin-top:4px}
.prow-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;background:rgba(0,0,0,.25);color:#f5efe0;border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:none;font-weight:600;text-align:left}
.prow-btn:active{transform:none}
.prow-btn small{display:block;color:#b9c9bf;font-weight:400;font-size:.8rem}
.prow-btn .st{color:#f7d877;font-variant-numeric:tabular-nums;font-size:.95rem;text-align:right}

/* Oyuncu kartı: ortada, ok ve kaydırma ile geçiş */
.mult{text-align:center;margin:-4px 0 12px}
.carousel{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;align-items:center;max-width:460px;margin:0 auto}
.nav{width:52px;min-height:88px;padding:0;font-size:2rem;line-height:1;background:rgba(0,0,0,.25);color:#f7d877;border:1px solid rgba(247,216,119,.4);box-shadow:none;border-radius:16px}
.nav:active{transform:none}
.stage{min-width:0;touch-action:pan-y}
.pcard{background:linear-gradient(165deg,#fffdf6 0%,#f3ebd6 60%,#e6dcc0 100%);color:#1b2a24;border-radius:22px;padding:22px 18px;box-shadow:0 10px 0 rgba(0,0,0,.35),0 18px 30px rgba(0,0,0,.4);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;min-height:360px;justify-content:center}
.pc-arrow{font-size:clamp(5rem,22vw,8rem);line-height:1;font-weight:900;color:#1f6f5c}
.pc-name{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:900;line-height:1.1;word-break:break-word}
.pc-note{font-size:.9rem;color:#b3412e;font-weight:700}
.pc-toggle{display:flex;align-items:center;gap:10px;font-weight:700;min-height:44px;cursor:pointer}
.pc-toggle input{width:24px;height:24px;accent-color:#2f8267}
.pc-field{display:flex;flex-direction:column;gap:6px;width:100%;max-width:260px;font-size:.85rem;color:#6b6456}
.pc-field input{background:#fff;color:#1b2a24;border:2px solid #cfc3a2;text-align:center;font-size:1.4rem;font-weight:800}
.pc-score{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.pc-score span{font-size:.8rem;color:#6b6456;text-transform:uppercase;letter-spacing:.1em}
.pc-score b{font-size:2.6rem;font-weight:900;color:#1f6f5c;font-variant-numeric:tabular-nums}
.pc-score b.neg{color:#b3412e}
.from-r{animation:swapR .35s ease both}
.from-l{animation:swapL .35s ease both}
@keyframes swapR{from{opacity:0;transform:translateX(40px) rotate(2deg)}to{opacity:1;transform:none}}
@keyframes swapL{from{opacity:0;transform:translateX(-40px) rotate(-2deg)}to{opacity:1;transform:none}}
.dots{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.dot2{width:14px;height:14px;min-height:0;padding:0;border-radius:50%;background:rgba(255,255,255,.25);box-shadow:none;border:none}
.dot2:active{transform:none}
.dot2.ok{background:#6fbf9f}
.dot2.on{background:#f7d877;transform:scale(1.3)}
.swipe-hint{text-align:center;margin:8px 0 0}
.sticky{position:sticky;bottom:0;background:linear-gradient(rgba(16,53,43,0),#12392f 30%);padding:14px 0 max(0px,env(safe-area-inset-bottom))}
.sticky button{width:100%}
.winner{font-size:1.35rem;font-weight:800;color:#f7d877;margin:10px 0 4px}
.pv{background:rgba(0,0,0,.28);border-radius:14px;padding:12px 14px;margin:14px 0}
.pvr{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.check{display:flex;align-items:center;gap:8px;min-height:44px}
.check.big{margin:12px 0}
.check input{width:22px;height:22px;accent-color:#f7d877}

/* Modal: telefonda tam ekran, geniş ekranda ortada kart */
.modal{position:fixed;inset:0;background:rgba(5,20,15,.7);backdrop-filter:blur(3px);display:flex;align-items:stretch;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:linear-gradient(180deg,#1b4d3d,#11352b);width:100%;height:100%;height:100dvh;overflow:auto;padding:18px 14px 24px;border-top:2px solid rgba(247,216,119,.5);overscroll-behavior:contain}
.sheet .muted{color:#c4d3ca}

/* Dar ekran: okey taşları 2 üst 2 alt */
@media (max-width:599px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));max-width:340px;margin-left:auto;margin-right:auto}
  .tile{max-width:150px}
}

/* Telefon */
@media (max-width:359px){
  .carousel{grid-template-columns:40px minmax(0,1fr) 40px;gap:6px}
  .nav{width:40px;min-height:72px}
}

/* Tablet ve üzeri */
@media (min-width:600px){
  .opt-grid{grid-template-columns:1fr 1fr}
  .home-tiles{grid-template-columns:repeat(4,96px)}
  .home-tiles .tile{width:96px;max-width:96px}
  .felt{padding:24px;gap:14px;border-width:12px}
  .trow{min-width:0}
  .teams{max-width:620px;margin-left:auto;margin-right:auto}
}
/* Geniş ekran */
@media (min-width:900px){
  .wrap{max-width:980px;padding:24px 24px 48px}
  .hero{padding:32px 28px}
  .pcard{min-height:380px;padding:28px 24px}
  .nav{min-height:110px}
  .modal{align-items:center}
  .sheet{max-width:720px;height:auto;max-height:90vh;border-radius:22px;border:2px solid rgba(247,216,119,.4);padding:24px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <h1>101 Okey</h1>
      <span aria-hidden="true"><i style="--c:#e0b400;--r:-8deg"></i><i style="--c:#2f6fc2;--r:-3deg"></i><i style="--c:#2b2b2b;--r:3deg"></i><i style="--c:#c8372d;--r:8deg"></i></span>
    </div>
    <span id="sub" class="muted"></span>
  </header>

  <!-- ANA EKRAN -->
  <section id="home" class="screen" hidden>
    <div class="card hero">
      <h2>Masa hazır mı?</h2>
      <p class="muted">Dört kişilik 101 Okey skorlarını bu cihazda tut.</p>
      <div class="home-tiles grp">
        <div class="tile" style="--c:#e0b400;--ink:#b08600"><span class="tname">Sarı</span><span class="tx">×3</span><span class="tbar"></span></div>
        <div class="tile" style="--c:#c8372d;--ink:#c8372d"><span class="tname">Kırmızı</span><span class="tx">×4</span><span class="tbar"></span></div>
        <div class="tile" style="--c:#2b2b2b;--ink:#2b2b2b"><span class="tname">Siyah</span><span class="tx">×5</span><span class="tbar"></span></div>
        <div class="tile" style="--c:#2f6fc2;--ink:#2f6fc2"><span class="tname">Mavi</span><span class="tx">×6</span><span class="tbar"></span></div>
      </div>
      <div><button id="btnMasaKur" class="big">Masa kur</button></div>
    </div>
    <div class="card hist">
      <h3 class="sec">Son masalar</h3>
      <div id="histCard"></div>
    </div>
  </section>

  <!-- KURULUM 1: TÜR -->
  <section id="wizMode" class="screen" hidden>
    <div class="bar"><button class="ghost" data-go="home">← Geri</button><h2>Oyun türü</h2></div>
    <div class="opt-grid grp">
      <button class="opt" data-mode="single"><b>Tekli</b><small>Herkes kendi puanını alır.</small></button>
      <button class="opt" data-mode="pair"><b>Eşli</b><small>Karşılıklı oyuncular eş olur, puanları toplanır.</small></button>
    </div>
  </section>

  <!-- KURULUM 2: İSİM / NUMARA -->
  <section id="wizNames" class="screen" hidden>
    <div class="bar"><button class="ghost" data-go="wizMode">← Geri</button><h2>Oyuncu adları</h2></div>
    <div class="opt-grid grp">
      <button class="opt" data-nm="real"><b>İsimle</b><small>Her oyuncunun adını kendin gir.</small></button>
      <button class="opt" data-nm="num"><b>Oyuncu 1-4</b><small>Adlar Oyuncu 1, 2, 3, 4 olarak kalır.</small></button>
    </div>
  </section>

  <!-- KURULUM 3: MASA -->
  <section id="wizSeats" class="screen" hidden>
    <div class="bar"><button class="ghost" data-go="wizNames">← Geri</button><h2>Masa</h2></div>
    <p id="seatHint" class="muted hint"></p>
    <div class="felt grp">
      <div class="seat s-top"><span class="pos">↑ Karşı</span><input id="s2" type="text" maxlength="18"></div>
      <div class="seat s-left"><span class="pos">← Sol</span><input id="s3" type="text" maxlength="18"></div>
      <div class="felt-mid">⟲<small>Oyun yönü</small></div>
      <div class="seat s-right"><span class="pos">Sağ →</span><input id="s1" type="text" maxlength="18"></div>
      <div class="seat s-bottom"><span class="pos">↓ Sen</span><input id="s0" type="text" maxlength="18"></div>
    </div>
    <p id="seatErr" class="err"></p>
    <div class="btns"><button id="seatNext">İleri</button></div>
  </section>

  <!-- OYUN EKRANI: SKOR TABLOSU -->
  <section id="board" class="screen" hidden>
    <div id="status" class="status"></div>
    <div id="boardActions" class="actions"></div>
    <div id="scoreCard" class="card"></div>
  </section>
</main>

<!-- MODAL -->
<div id="modal" class="modal" hidden>
  <div id="sheet" class="sheet"></div>
</div>

<script>
// ---- Sabitler ----
const COLORS = [
  { n: 'Sarı',    k: 3, c: '#e0b400', ink: '#b08600' },
  { n: 'Kırmızı', k: 4, c: '#c8372d', ink: '#c8372d' },
  { n: 'Siyah',   k: 5, c: '#2b2b2b', ink: '#2b2b2b' },
  { n: 'Mavi',    k: 6, c: '#2f6fc2', ink: '#2f6fc2' }
];
const POS = ['Sen', 'Sağ', 'Karşı', 'Sol']; // koltuk sırası 0,1,2,3
const ARROW = ['↓', '→', '↑', '←'];         // koltuğun masadaki yönü
const PLACE = ['altta', 'sağda', 'karşıda', 'solda'];
const KEY = 'okey101-v1';                  // devam eden masa
const KEY_HIST = 'okey101-history';        // kaydedilmiş masalar (en fazla 3)
const HIST_MAX = 3;
const STEP = 0.45;                         // öğeler arası animasyon gecikmesi (sn)

// ---- Yardımcılar ----
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmtDate = iso => new Date(iso).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

// ---- Durum ----
let game = loadGame();   // { mode, names[4], rounds[], inRound }
let draft = null;        // açık tur formunun verisi
let stack = [];          // modal içindeki adımlar (Geri için)
let editIdx = null;      // düzenlenen turun indeksi (null = yeni tur)
let wiz = { mode: 'single', nm: 'real' };

function loadGame() {
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveGame() {
  try { localStorage.setItem(KEY, JSON.stringify(game)); }
  catch (e) { /* kaydedilemedi: uygulama yine çalışır */ }
}
function loadHistory() {
  try { const raw = localStorage.getItem(KEY_HIST); return raw ? JSON.parse(raw) : []; }
  catch (e) { return []; }
}
function saveHistory(list) {
  try { localStorage.setItem(KEY_HIST, JSON.stringify(list)); }
  catch (e) { /* kaydedilemedi */ }
}

// ---- Animasyon: .grp içindeki öğeler sırayla düşer ----
function playIntro(root) {
  root.querySelectorAll('.grp').forEach(g => {
    [...g.children].forEach((c, k) => c.style.setProperty('--d', (k * STEP).toFixed(2) + 's'));
    clearTimeout(g._t);
    if (reduced()) { g.classList.remove('intro'); return; }
    g.classList.add('intro');
    g._t = setTimeout(() => g.classList.remove('intro'), (g.children.length - 1) * STEP * 1000 + 750);
  });
}

// ---- Puan hesabı (kurallara göre) ----
// d.finisher: eli bitiren indeks (null = kimse bitmedi)
// d.okey: dışarı veya çift ise true
function computeRound(d) {
  const anyOpen = d.opened.some(Boolean);
  const finished = d.finisher !== null;
  const mult = (finished && !anyOpen ? 2 : 1) * (d.okey ? 2 : 1) * COLORS[d.color].k;
  const base = [0, 1, 2, 3].map(i => {
    if (i === d.finisher) return -200;           // eli bitiren
    if (!d.opened[i]) return 200;                // hiç açamayıp taşları elinde kalan
    return Number(d.rack[i]) || 0;               // açan: ıstakadaki taşların toplamı
  });
  return { mult, scores: base.map(b => b * mult) };
}

// Bir masanın toplamları ve sıralaması
function totalsOf(g) {
  return [0, 1, 2, 3].map(i => g.rounds.reduce((s, r) => s + r.scores[i], 0));
}
function rankRows(g) {
  const totals = totalsOf(g);
  let rows;
  if (g.mode === 'pair') {
    rows = [[0, 2], [1, 3]].map(t => ({ label: `${esc(g.names[t[0]])} &amp; ${esc(g.names[t[1]])}`, score: totals[t[0]] + totals[t[1]] }));
  } else {
    rows = g.names.map((n, i) => ({ label: esc(n), score: totals[i] }));
  }
  rows.sort((a, b) => a.score - b.score);
  const tie = rows.length > 1 && rows[0].score === rows[1].score;
  return { rows, tie };
}

// ---- Ekranlar ----
function showScreen(id) {
  ['home', 'wizMode', 'wizNames', 'wizSeats', 'board'].forEach(s => { $(s).hidden = s !== id; });
  if (id === 'home') renderHome();
  if (id === 'wizSeats') syncSeats();
  if (id === 'board') renderBoard();
  playIntro($(id));
}
function render() {
  showScreen(game ? 'board' : 'home');
}

function renderHome() {
  const hist = loadHistory();
  $('histCard').innerHTML = hist.length
    ? `<div class="plist">${hist.map((rec, i) => {
        const { rows } = rankRows(rec);
        return `<button class="prow-btn" data-hist="${i}">
          <span>${fmtDate(rec.date)}<small>${rec.mode === 'pair' ? 'Eşli' : 'Tekli'} · ${rec.rounds.length} tur</small></span>
          <span class="st">${rows[0].label}<br>${rows[0].score}</span>
        </button>`;
      }).join('')}</div>`
    : '<p class="muted">Henüz kaydedilmiş masa yok.</p>';
}
$('histCard').addEventListener('click', e => {
  const b = e.target.closest('[data-hist]');
  if (b) openHistView(Number(b.dataset.hist));
});

function renderBoard() {
  const r = game.inRound;
  $('sub').textContent = (game.mode === 'pair' ? 'Eşli' : 'Tekli') + ' · ' + game.rounds.length + ' tur';

  if (r) {
    const c = COLORS[r.color];
    $('status').innerHTML = `<span class="mini" style="--c:${c.c};--ink:${c.ink}">×${c.k}<small>${c.n}</small></span>
      <span>${game.rounds.length + 1}. tur devam ediyor · Okey: ${c.n}</span>`;
  } else {
    $('status').textContent = "Yeni tur için Başla'ya bas.";
  }

  let acts = '';
  if (!r) {
    acts += '<button class="big" data-act="start">Başla</button>';
    if (game.rounds.length) {
      acts += '<button class="ghost" data-act="edit">Düzenle</button>';
      acts += '<button class="ghost" data-act="end">Bitir</button>';
    }
  } else {
    acts += '<button data-act="finish">Eli bitir ve skorları kaydet</button>';
    acts += '<button class="ghost" data-act="change">Okey rengini tekrar seç</button>';
    acts += '<button class="danger" data-act="leave">Masadan ayrıl</button>';
  }
  $('boardActions').innerHTML = acts;
  $('scoreCard').innerHTML = boardHTML(game);
}

// Skor tablosu (devam eden masa ya da kayıtlı masa için)
function boardHTML(g) {
  const names = g.names;
  const totals = totalsOf(g);
  const isPair = g.mode === 'pair';
  const teams = [[0, 2], [1, 3]];
  const teamTotals = teams.map(t => totals[t[0]] + totals[t[1]]);
  const minVal = isPair ? Math.min(...teamTotals) : Math.min(...totals);

  let h = '<div class="table">';
  h += '<div class="trow thead"><div>Tur</div>' +
       [0, 1, 2, 3].map(i => `<div><small>${POS[i]}</small>${esc(names[i])}</div>`).join('') + '</div>';
  g.rounds.forEach((r, idx) => {
    h += `<div class="trow"><div>${idx + 1}<small>${COLORS[r.color].n} ×${r.mult}</small></div>` +
         r.scores.map(s => `<div class="${s < 0 ? 'neg' : ''}">${s}</div>`).join('') + '</div>';
  });
  h += '<div class="trow total"><div>Toplam</div>' +
       totals.map((t, i) => `<div class="${!isPair && t === minVal ? 'lead' : ''}">${t}</div>`).join('') + '</div>';
  h += '</div>';

  if (isPair) {
    h += '<div class="teams">' + teams.map((t, i) =>
      `<div class="team ${teamTotals[i] === minVal ? 'lead' : ''}">${esc(names[t[0]])} &amp; ${esc(names[t[1]])}<b>${teamTotals[i]}</b></div>`
    ).join('') + '</div>';
  }
  if (!g.rounds.length) h += '<p class="muted">Henüz tur kaydedilmedi.</p>';
  return h;
}

// ---- Kurulum sihirbazı ----
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) showScreen(b.dataset.go);
});
$('btnMasaKur').addEventListener('click', () => showScreen('wizMode'));
$('wizMode').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]');
  if (b) { wiz.mode = b.dataset.mode; showScreen('wizNames'); }
});
$('wizNames').addEventListener('click', e => {
  const b = e.target.closest('[data-nm]');
  if (b) { wiz.nm = b.dataset.nm; showScreen('wizSeats'); }
});

function syncSeats() {
  const num = wiz.nm === 'num';
  for (let i = 0; i < 4; i++) {
    const inp = $('s' + i);
    if (num) {
      inp.value = 'Oyuncu ' + (i + 1);
      inp.disabled = true;
    } else {
      inp.disabled = false;
      if (/^Oyuncu \d$/.test(inp.value)) inp.value = '';
      inp.placeholder = 'İsim';
    }
  }
  $('seatHint').textContent = wiz.mode === 'pair'
    ? 'Eşler: Sen & Karşı, Sağ & Sol. Eşlerin puanları toplanır.'
    : 'Her oyuncu kendi puanını alır.';
  $('seatErr').textContent = '';
}

$('seatNext').addEventListener('click', () => {
  const names = [0, 1, 2, 3].map(i => $('s' + i).value.trim());
  if (names.some(n => !n)) { $('seatErr').textContent = 'Dört oyuncunun da adını gir.'; return; }
  if (new Set(names).size < 4) { $('seatErr').textContent = 'Aynı isimden iki tane olamaz.'; return; }
  game = { mode: wiz.mode, names, rounds: [], inRound: null };
  saveGame();
  render();
});

// ---- Tablo düğmeleri ----
$('boardActions').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  if (a === 'start') openStart();
  else if (a === 'finish') openFinisher();
  else if (a === 'end') openFinishWarn();
  else if (a === 'edit') openEditList();
  else if (a === 'change') openChangeInfo();
  else if (a === 'leave') openLeave();
});

// ---- Modal yönetimi ----
function go(fn) {
  $('modal').hidden = false;
  stack.push(fn);
  fn();
}
function back() {
  stack.pop();
  const prev = stack[stack.length - 1];
  if (prev) prev();
  else closeModal();
}
function closeModal() {
  $('modal').hidden = true;
  $('sheet').innerHTML = '';
  draft = null;
  editIdx = null;
  stack = [];
}
const bar = title => `<div class="bar"><button class="ghost" data-back>← Geri</button><h2>${title}</h2></div>`;

// Okey rengi (başlangıç ya da değiştirme)
function openStart() { stack = []; go(renderColor); }
function openChangeInfo() { stack = []; go(renderChangeInfo); }
function renderChangeInfo() {
  $('sheet').innerHTML = bar('Okey rengini tekrar seç') + `
    <div class="card">
      <p>Bu turun okey rengi değişecek.</p>
      <p class="muted">Tur baştan başlamaz, devam eder. Kayıtlı turlar etkilenmez. Bu turun puanları yeni renge göre çarpılır.</p>
    </div>
    <div class="btns">
      <button class="ghost" data-close>Vazgeç</button>
      <button id="changeNext">Yeni rengi seç</button>
    </div>`;
}
function renderColor() {
  $('sheet').innerHTML = bar('Okey rengi hangisi?') + `
    <p class="muted">Puanlar tur sonunda bu renge göre çarpılır.</p>
    <div class="tiles grp">
      ${COLORS.map((c, i) => `
        <button class="tile" data-color="${i}" style="--c:${c.c};--ink:${c.ink}">
          <span class="tname">${c.n}</span>
          <span class="tx">×${c.k}</span>
          <span class="tbar"></span>
        </button>`).join('')}
    </div>`;
  playIntro($('sheet'));
}

// Masadan ayrıl (kayıt tutulmaz)
function openLeave() { stack = []; go(renderLeave); }
function renderLeave() {
  $('sheet').innerHTML = bar('Masadan ayrıl') + `
    <div class="card">
      <p>Masadan ayrılırsan devam eden tur iptal olur.</p>
      <p>Bu masa kaydedilmeden silinir ve ana ekrana dönersin.</p>
      <p class="muted">Bu işlem geri alınamaz.</p>
    </div>
    <div class="btns">
      <button class="ghost" data-close>Vazgeç</button>
      <button class="danger" id="leaveYes">Evet, masadan ayrıl</button>
    </div>`;
}

// Bitir: uyarı, onay, sonra masa kaydedilir
function openFinishWarn() { stack = []; go(renderFinishWarn); }
function renderFinishWarn() {
  $('sheet').innerHTML = bar('Masayı bitir') + `
    <div class="card">
      <p><b>Bitir'e basarsan artık bu masada yeni el başlatamazsın.</b></p>
      <p>Masa kaydedilip ana menüye döneceksin. Son 3 masa bu cihazda saklanır.</p>
    </div>
    <div class="btns">
      <button class="ghost" data-close>Vazgeç</button>
      <button id="finishYes">Bitir ve kaydet</button>
    </div>`;
}
function finishTable() {
  const rec = {
    id: Date.now(),
    date: new Date().toISOString(),
    mode: game.mode,
    names: game.names,
    rounds: game.rounds
  };
  saveHistory([rec, ...loadHistory()].slice(0, HIST_MAX));
  game = null;
  saveGame();
  render();   // arkada ana ekran hazır dursun
  showResult(rec);
}
function showResult(rec) {
  const { rows, tie } = rankRows(rec);
  stack = [];
  $('modal').hidden = false;
  $('sheet').innerHTML = `
    <h2>Masa kaydedildi</h2>
    <p class="muted">${rec.rounds.length} tur oynandı.</p>
    <p class="winner">${tie ? 'Berabere' : 'Kazanan: ' + rows[0].label}</p>
    <div class="pv">
      ${rows.map((r, i) => `<div class="pvr"><span>${i + 1}. ${r.label}</span><b class="${i === 0 ? 'winner' : ''}">${r.score}</b></div>`).join('')}
    </div>
    <div class="btns"><button id="resultHome">Ana menüye dön</button></div>`;
}

// Son masalar: kayıtlı bir masayı göster
function openHistView(i) {
  const rec = loadHistory()[i];
  if (!rec) return;
  stack = [];
  go(() => renderHistView(rec));
}
function renderHistView(rec) {
  $('sheet').innerHTML = bar('Kayıtlı masa') + `
    <p class="muted">${fmtDate(rec.date)} · ${rec.mode === 'pair' ? 'Eşli' : 'Tekli'} · ${rec.rounds.length} tur</p>
    <div class="card">${boardHTML(rec)}</div>
    <div class="btns"><button class="ghost" data-close>Kapat</button></div>`;
}

// Düzenle: önce tur seçilir, sonra aynı tur adımlarından geçilir
function openEditList() {
  stack = [];
  go(renderEditList);
}
function renderEditList() {
  $('sheet').innerHTML = bar('Düzenlenecek turu seç') + `
    <div class="plist grp">
      ${game.rounds.map((r, i) => `
        <button class="prow-btn" data-edit="${i}">
          <span>${i + 1}. tur<small>${COLORS[r.color].n} ×${r.mult}</small></span>
          <span class="st">${r.scores.join(' · ')}</span>
        </button>`).join('')}
    </div>`;
  playIntro($('sheet'));
}
function startEdit(i) {
  const r = game.rounds[i];
  const hasDetail = Array.isArray(r.opened);   // eski kayıtlarda oyuncu girdileri yok
  editIdx = i;
  draft = {
    color: r.color,
    finisher: r.finisher,
    how: r.how || null,
    okey: !!r.how && r.how !== 'normal',
    opened: hasDetail ? r.opened.slice() : [false, false, false, false],
    rack: hasDetail ? r.rack.slice() : ['', '', '', ''],
    visited: [hasDetail, hasDetail, hasDetail, hasDetail],
    sel: 0
  };
  stack = [renderEditList];
  go(renderFinisher);
}

// Tur sonu: eli kim bitirdi → nasıl bitti → puanlar
function openFinisher() {
  if (!game.inRound) return;
  editIdx = null;
  draft = {
    color: game.inRound.color,
    finisher: null,
    how: null,
    okey: false,
    opened: [false, false, false, false],
    rack: ['', '', '', ''],
    visited: [true, false, false, false], // ilk oyuncu kartta açık geliyor
    sel: 0
  };
  stack = [];
  go(renderFinisher);
}
function renderFinisher() {
  const title = editIdx !== null ? `${editIdx + 1}. tur · Eli kim bitirdi?` : `${game.rounds.length + 1}. tur · Eli kim bitirdi?`;
  const sel = (v) => (editIdx !== null && draft.finisher === v ? ' sel' : '');
  $('sheet').innerHTML = bar(title) + `
    <div class="opt-grid grp">
      ${game.names.map((nm, i) => `<button class="opt${sel(i)}" data-fin="${i}"><b>${esc(nm)}</b><small>${POS[i]}</small></button>`).join('')}
      <button class="opt wide${editIdx !== null && draft.finisher === null ? ' sel' : ''}" data-fin="none"><b>Hiç kimse bitmedi</b><small>Eli kimse bitirmediyse bu seçeneği seç.</small></button>
    </div>`;
  playIntro($('sheet'));
}
function renderHow() {
  const sel = (v) => (editIdx !== null && draft.how === v ? ' sel' : '');
  $('sheet').innerHTML = bar('Eli nasıl bitirdi?') + `
    <div class="opt-grid grp">
      <button class="opt wide${sel('normal')}" data-how="normal"><b>Normal</b><small>Okey ya da çift olmadan bitirdi.</small></button>
      <button class="opt wide${sel('disari')}" data-how="disari"><b>Dışarı</b><small>Son taşı okeyle attı. Puanlar 2 ile çarpılır.</small></button>
      <button class="opt wide${sel('cift')}" data-how="cift"><b>Çift</b><small>Aynı renk ve sayıdaki taşlarla per yaparak bitirdi. Dışarı gibi sayılır.</small></button>
    </div>`;
  playIntro($('sheet'));
}

function playerValid(i) {
  const d = draft;
  if (!d.visited[i]) return false;
  if (i === d.finisher) return true;
  if (!d.opened[i]) return true;
  const v = d.rack[i];
  return v !== '' && Number(v) >= 0;
}

// Puan ekranı: ortada tek oyuncu kartı, ok ve kaydırma ile geçiş
function renderScore() {
  $('sheet').innerHTML = bar(editIdx !== null ? `${editIdx + 1}. turu düzenle` : 'Tur puanları') + `
    <p class="muted mult" id="multLine"></p>
    <div class="carousel">
      <button class="nav" data-nav="-1" aria-label="Önceki oyuncu">‹</button>
      <div class="stage" id="stage"></div>
      <button class="nav" data-nav="1" aria-label="Sonraki oyuncu">›</button>
    </div>
    <div class="dots" id="dots">
      ${[0, 1, 2, 3].map(i => `<button class="dot2" data-go-p="${i}" aria-label="${esc(game.names[i])}"></button>`).join('')}
    </div>
    <p class="muted swipe-hint">Kaydırarak ya da okla diğer oyuncuya geç.</p>
    <div class="btns sticky"><button id="btnSaveRound" disabled>${editIdx !== null ? 'Değişikliği kaydet' : 'Skorları kaydet'}</button></div>`;
  wireSwipe();
  refreshCarousel(0);
}

function cardHTML() {
  const d = draft;
  const i = d.sel;
  const r = computeRound(d);
  const ok = playerValid(i);
  const sc = ok ? r.scores[i] : '—';
  return `
    <div class="pcard" data-card="${i}">
      <div class="pc-arrow">${ARROW[i]}</div>
      <div class="pc-name">${esc(game.names[i])}</div>
      ${d.finisher === i ? '<div class="pc-note">Eli bitirdiği için −200</div>' : ''}
      <label class="pc-toggle"><input type="checkbox" data-open="${i}" ${d.opened[i] ? 'checked' : ''}><span>Per açtı</span></label>
      ${d.opened[i] && d.finisher !== i ? `
        <label class="pc-field"><span>Istakada kalan taşların toplamı</span>
          <input type="number" inputmode="numeric" min="0" max="999" placeholder="0" data-rack value="${esc(d.rack[i])}">
        </label>` : ''}
      <div class="pc-score"><span>Bu tur</span><b id="pcScore" class="${ok && sc < 0 ? 'neg' : ''}">${sc}</b></div>
    </div>`;
}

// Kartı yeniden çizer; yön verilirse kayma animasyonu oynar
function refreshCarousel(dir) {
  const st = $('stage');
  st.innerHTML = cardHTML();
  if (dir) st.firstElementChild.classList.add(dir > 0 ? 'from-r' : 'from-l');
  document.querySelectorAll('.dot2').forEach((el, i) => {
    el.classList.toggle('on', i === draft.sel);
    el.classList.toggle('ok', playerValid(i));
  });
  updateScoreUI();
}

function moveTo(i, dir) {
  draft.sel = i;
  draft.visited[i] = true;
  refreshCarousel(dir);
}
function step(dir) {
  moveTo((draft.sel + dir + 4) % 4, dir);
}

// Parmakla kaydırma (inputa dokunulduysa sayılmaz)
function wireSwipe() {
  const st = $('stage');
  let x0 = null;
  st.addEventListener('touchstart', e => {
    x0 = e.target.closest('input') ? null : e.touches[0].clientX;
  }, { passive: true });
  st.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
  });
}

// Yazarken sadece sayıları günceller; klavye açık kalsın diye kartı yeniden çizmez
function updateScoreUI() {
  const d = draft;
  const r = computeRound(d);
  const anyOpen = d.opened.some(Boolean);
  const notes = [
    d.finisher !== null && !anyOpen && 'kimse açmadı ×2',
    d.okey && (d.how === 'cift' ? 'çift ×2' : 'dışarı ×2'),
    `${COLORS[d.color].n} ×${COLORS[d.color].k}`
  ].filter(Boolean).join(' · ');
  $('multLine').textContent = `Çarpan ×${r.mult} (${notes})`;

  const ps = $('pcScore');
  if (ps) {
    const ok = playerValid(d.sel);
    ps.textContent = ok ? r.scores[d.sel] : '—';
    ps.className = ok && r.scores[d.sel] < 0 ? 'neg' : '';
  }
  document.querySelectorAll('.dot2').forEach((el, i) => el.classList.toggle('ok', playerValid(i)));
  $('btnSaveRound').disabled = ![0, 1, 2, 3].every(playerValid);
}

// Yeni turu ekler ya da düzenlenen turun yerine yazar
function saveRound() {
  if (![0, 1, 2, 3].every(playerValid)) return;
  const r = computeRound(draft);
  const round = {
    color: draft.color,
    finisher: draft.finisher,
    how: draft.how,
    okey: draft.okey,
    opened: draft.opened.slice(),
    rack: draft.rack.slice(),
    mult: r.mult,
    scores: r.scores
  };
  if (editIdx !== null) {
    game.rounds[editIdx] = round;
  } else {
    game.rounds.push(round);
    game.inRound = null;
  }
  saveGame();
  closeModal();
  render();
}

// ---- Modal içi tıklamalar ----
$('sheet').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-back]')) { back(); return; }
  if (t.closest('[data-close]')) { closeModal(); return; }
  if (t.closest('#resultHome')) { closeModal(); render(); return; }
  if (t.closest('#finishYes')) { finishTable(); return; }

  const color = t.closest('[data-color]');
  if (color) {
    game.inRound = { color: Number(color.dataset.color) };
    saveGame();
    closeModal();
    render();
    return;
  }
  if (t.closest('#changeNext')) { go(renderColor); return; }
  if (t.closest('#leaveYes')) {
    game = null;
    saveGame();
    closeModal();
    render();
    return;
  }

  const edit = t.closest('[data-edit]');
  if (edit) { startEdit(Number(edit.dataset.edit)); return; }

  const fin = t.closest('[data-fin]');
  if (fin) {
    const v = fin.dataset.fin;
    draft.finisher = v === 'none' ? null : Number(v);
    if (draft.finisher === null) { draft.how = null; draft.okey = false; go(renderScore); }
    else go(renderHow);
    return;
  }

  const how = t.closest('[data-how]');
  if (how) {
    draft.how = how.dataset.how;
    draft.okey = draft.how !== 'normal';
    go(renderScore);
    return;
  }

  const nav = t.closest('[data-nav]');
  if (nav) { step(Number(nav.dataset.nav)); return; }

  const dot = t.closest('[data-go-p]');
  if (dot) {
    const i = Number(dot.dataset.goP);
    moveTo(i, i > draft.sel ? 1 : -1);
    return;
  }

  const save = t.closest('#btnSaveRound');
  if (save && !save.disabled) saveRound();
});

// Kart içindeki değişiklikler
$('sheet').addEventListener('input', e => {
  if (draft && e.target.matches('[data-rack]')) {
    draft.rack[draft.sel] = e.target.value;
    updateScoreUI();
  }
});
$('sheet').addEventListener('change', e => {
  if (draft && e.target.matches('[data-open]')) {
    draft.opened[draft.sel] = e.target.checked;
    refreshCarousel(0);
  }
});

// ---- Başlangıç ----
syncSeats();
render();
</script>
</body>
</html>
